name: Sync music from Notion

on:
  workflow_dispatch:
  schedule:
    - cron: '27 * * * *'

permissions:
  contents: write

concurrency:
  group: notion-music-collection
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ vars.NOTION_MUSIC_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Copy published songs and attachments from Notion
        env:
          NOTION_MUSIC_TOKEN: ${{ secrets.NOTION_MUSIC_TOKEN }}
          NOTION_MUSIC_DATABASE_ID: ${{ secrets.NOTION_MUSIC_DATABASE_ID }}
        run: node scripts/music-sync.mjs
      - name: Update collection introduction
        run: node scripts/readme.mjs
      - name: Verify published assets and sync failure recovery
        run: node --test scripts/tests/*.test.mjs
      - name: Save changed collection
        run: |
          git add music README.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sync published music and listening links from Notion'
          git pull --rebase origin main
          git push origin HEAD:main
